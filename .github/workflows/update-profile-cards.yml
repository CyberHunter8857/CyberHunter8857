name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *" # runs daily at 3 AM UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- GitHub Stats ----------
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      # ---------- Top Languages ----------
      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      # ---------- Streak Stats ----------
      - name: Generate streak stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.TROPHY_TOKEN }}
          output-path: profile/streak.svg
          theme: tokyonight
          hide-border: true

      # ---------- Trophies ----------
      # Uses a Personal Access Token (repo secret: TROPHY_TOKEN) instead of GITHUB_TOKEN,
      # because the trophy script needs read:user scope that GITHUB_TOKEN doesn't have.
      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy.svg
          theme: tokyonight
          token: ${{ secrets.TROPHY_TOKEN }}

      # ---------- Commit the generated cards ----------
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards [skip ci]" || exit 0
          git push
